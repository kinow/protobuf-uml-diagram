[build-system]
requires = ["setuptools", "wheel", "pytest-runner>=4.1,<6.1"]
build-backend = "setuptools.build_meta"

[project]
name = "protobuf-uml-diagram"
version = "0.16.dev0"
description = "Create UML diagrams from Protobuf proto files"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
authors = [
    { name = "Bruno P. Kinoshita", email = "brunodepaulak@yahoo.com.br" }
]
license = { file = "LICENSE.txt" }
dependencies = [
    "click>=7.1,<8.2",
    "graphviz>=0.14,<0.22",
    "protobuf>=3.13,<6.34"
]

[project.urls]
Homepage = "https://github.com/kinow/protobuf-uml-diagram/"

[project.scripts]
protobuf-uml-diagram = "protobuf_uml_diagram:main"

[project.optional-dependencies]
tests = [
    "codecov==2.1.*",
    "coverage>=5.3,<7.11",
    "pytest-cov>=2.10,<7.2",
    "pytest-env==1.1.5",
    "pytest-mock>=3.11,<3.16",
    "pytest>=6.1,<8.5",
    "pycodestyle>=2.6,<2.15"
]
mypy = [
    "mypy==1.*",
    "types-protobuf>=4.24,<6.33"
]
all = [
    "protobuf-uml-diagram[tests]",
    "protobuf-uml-diagram[mypy]"
]

[tool.setuptools]
py-modules = ["protobuf_uml_diagram"]
