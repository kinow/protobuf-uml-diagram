[build-system]
requires = ["setuptools", "wheel", "pytest-runner>=4.1,<6.1"]
build-backend = "setuptools.build_meta"

[project]
name = "protobuf-uml-diagram"
version = "0.17.dev0"
description = "Create UML diagrams from Protobuf proto files"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
authors = [
    { name = "Bruno P. Kinoshita", email = "brunodepaulak@yahoo.com.br" }
]
license = { file = "LICENSE.txt" }
dependencies = [
    "click>=8.4.2",
    "graphviz>=0.21",
    "protobuf>=7.35.1"
]

[project.urls]
Homepage = "https://github.com/kinow/protobuf-uml-diagram/"

[project.scripts]
protobuf-uml-diagram = "protobuf_uml_diagram:main"

[project.optional-dependencies]
tests = [
    "codecov==2.1.13",
    "coverage>=7.15.2",
    "pytest-cov>=7.1.0",
    "pytest-env==1.6.0",
    "pytest-mock>=3.15.1",
    "pytest>=9.1.1",
    "pycodestyle>=2.14.0"
]
mypy = [
    "mypy==2.3.0",
    "types-protobuf>=7.34.1.20260518"
]
all = [
    "protobuf-uml-diagram[tests]",
    "protobuf-uml-diagram[mypy]"
]

[tool.setuptools]
py-modules = ["protobuf_uml_diagram"]
